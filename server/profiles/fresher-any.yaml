search:
  title_keywords_positive: [junior, graduate, entry level, associate, trainee, fresher, software engineer]
  title_keywords_negative: [senior, lead, principal, director, manager, unpaid]
  relevant_tech: [javascript, python, java, react, node, sql, html, css, git]
  jsearch_queries:
    - query: "junior software engineer fresher"
      country: "IN"
      date_posted: "3days"

scoring:
  experience_target: fresher
  min_score_to_store: 15
  weights: { title: 35, tech: 35, experience: 15, signal: 15 }
  core_tech: [javascript, python, java]

location:
  region_positive: [india, bangalore, mumbai, hyderabad, pune, remote, worldwide, global]
  region_negative: ["us only", "eu only", "no visa sponsorship", "5+ years"]

outreach:
  candidate_name: "Your Name"
  bio_short: "Recent CS graduate with hands-on project experience"
  dm_short_template: "{greeting}, I noticed {company} is hiring for {title}. {bio_short} — would love to connect."
  dm_long_template: "{greeting},\n\nI noticed {company} is hiring for {title}. {bio_short}\n\n{achievements}\n\nWould love to connect and learn more about the opportunity.\n\nBest,\n{candidate_name}"
  recipient_email: "you@example.com"

email:
  daily_hour: 9
  daily_jobs_count: 15
